# Fixture distro declaration (ozone.yml): selection + vars + model-overrides

selection:
  apps:
    - alpha
    - beta
    - keycloak

vars:
  # Fixture distro-level overrides
  apps:
    alpha:
      configs:
        ALPHA_PASSWORD: distro-pass
      paths:
        ALPHA_DATA_PATH: data
  databases:
    paths:
      SQL_SCRIPTS_PATH: data

model-overrides:
  # Fixture distro-level model overlay: strictly additive - new entries and
  # appended files; declared scalars override the base's values.
  apps:
    alpha:
      compose: [c2c/alpha-tuning.yml]
      url: ${SERVER_SCHEME}://c2c.example.org/alpha
    c2c-connector:
      compose: [c2c/connector.yml]
      db: [mysql, redis]
      db-init: [c2c-connector]
      url: ${SERVER_SCHEME}://${C2C_HOSTNAME}
      credentials: [C2C_USER]
  
  databases:
    redis: c2c/redis.yml
  
  addons:
    c2c-maintenance:
      compose: [c2c/maintenance.yml]
  
  incompatibilities:
    - [beta, c2c-connector]
  
  deployment:
    services:
      c2c-connector:
        hostnames:
          C2C_HOSTNAME: ${HOST_NAME}:9090
    extra:
      C2C_EXTRA: c2c
